<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBot · SRMIST Campus Knowledge Assistant</title>
  <meta name="description" content="CampusBot · SRMIST Campus Knowledge Assistant" />
  <style>
        :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      --font-mono: "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, Monaco, monospace;

      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --border: #e2e8f0;
      --border-subtle: #edf2f7;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --user-bubble: #2563eb;
      --user-text: #ffffff;
      --bot-bubble: #ffffff;
      --bot-bubble-border: #e2e8f0;

      --green-bg: #ecfdf5;
      --green-border: #a7f3d0;
      --green-text: #065f46;

      --amber-bg: #fffbeb;
      --amber-border: #fde68a;
      --amber-text: #92400e;

      --red-bg: #fef2f2;
      --red-border: #fecaca;
      --red-text: #991b1b;

      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 10px 30px -5px rgba(15, 23, 42, 0.12);
      --radius: 12px;
      --sidebar-w: 260px;
    }

    html[data-theme="dark"] {
      --bg: #090d16;
      --surface: #101726;
      --surface-2: #162032;
      --surface-3: #1f2d45;
      --border: #1e293b;
      --border-subtle: #172033;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --user-bubble: #2563eb;
      --user-text: #ffffff;
      --bot-bubble: #101726;
      --bot-bubble-border: #1e293b;

      --green-bg: rgba(16, 185, 129, 0.14);
      --green-border: rgba(52, 211, 153, 0.35);
      --green-text: #6ee7b7;

      --amber-bg: rgba(245, 158, 11, 0.14);
      --amber-border: rgba(251, 191, 36, 0.35);
      --amber-text: #fde68a;

      --red-bg: rgba(239, 68, 68, 0.14);
      --red-border: rgba(248, 113, 113, 0.35);
      --red-text: #fca5a5;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 4px 16px -2px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 30;
      transition: transform 0.2s ease;
    }

    .sidebar-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      background: #000 !important;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35) !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: none !important;
    }
    .sidebar-logo-img, .hero-logo-img, .avatar-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: inherit;
    }
    .bot-badge-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.12);
      margin-bottom: 14px;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      margin-top: 2px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      letter-spacing: 0.4px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 7px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover { background: var(--surface-3); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-icon {
      padding: 6px 8px;
      font-size: 14px;
    }

    .new-chat-wrap {
      padding: 12px 14px 8px;
    }

    .new-chat-wrap .btn {
      width: 100%;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      border: 1px solid transparent;
    }

    .session-item:hover {
      background: var(--surface-2);
    }

    .session-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      font-weight: 600;
    }

    .session-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-del {
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 5px;
      border-radius: 5px;
      line-height: 1;
    }

    .session-del:hover {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .sidebar-footer {
      padding: 10px 14px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-footer-row {
      display: flex;
      gap: 8px;
    }

    .sidebar-footer-row .btn {
      flex: 1;
      font-size: 12px;
      padding: 6px 8px;
    }

    /* Main Workspace */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    
    .topbar-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-right: 4px;
    }
    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .menu-btn {
      display: none;
    }

    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .badge-green {
      background: var(--surface-2) !important;
      border-color: rgba(16, 185, 129, 0.3) !important;
      color: var(--text) !important;
    }
    .badge-green .dot {
      background: #10b981 !important;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6) !important;
    }

    .badge-amber {
      background: var(--surface-2) !important;
      border-color: rgba(245, 158, 11, 0.3) !important;
      color: var(--text) !important;
    }
    .badge-amber .dot {
      background: #f59e0b !important;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.6) !important;
    }

    .badge-role {
      background: var(--surface-2) !important;
      border-color: var(--border) !important;
      color: var(--text-muted) !important;
    }

    .composer-hint {
      max-width: 800px;
      margin: 8px auto 0;
      font-size: 11.5px;
      color: var(--text-muted) !important;
      opacity: 0.8;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .composer-hint span {
      color: var(--text-muted) !important;
    }

    .tpl-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface) !important;
      padding: 14px 16px;
      margin-top: 8px;
      box-shadow: var(--shadow-sm);
    }
    .kv-item {
      background: var(--surface-2) !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }


    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* Chat area */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 24px;
    }

    .chat-inner {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

        /* Welcome Hero & Starter Chips */
    .welcome-hero {
      text-align: center;
      padding: 36px 16px 20px;
      max-width: 720px;
      margin: 0 auto;
    }
    .bot-badge-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
      margin-bottom: 14px;
    }
    .welcome-hero h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .welcome-hero .hero-sub {
      margin: 0 auto 24px;
      font-size: 14.5px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 500px;
    }
        .starter-label {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
      margin-bottom: 12px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .starter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .starter-chip {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      color: var(--text);
      font-family: var(--font-sans);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .starter-chip:hover {
      border-color: var(--accent);
      background: var(--surface-2);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .starter-chip-tool {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.2px;
    }
    .starter-chip-tool svg {
      flex-shrink: 0;
    }
    .starter-chip-q {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text);
    }

/* Chat rows & avatars */
    .msg-row {
      display: flex;
      gap: 12px;
      width: 100%;
      animation: slideUp 0.18s ease-out;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .msg-row.assistant {
      justify-content: flex-start;
      align-items: flex-start;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    .msg-content {
      max-width: 84%;
      display: flex;
      flex-direction: column;
    }
    .msg-row.assistant .msg-content {
      max-width: 90%;
      flex: 1;
    }
    .msg-bubble {
      border-radius: 16px;
      padding: 13px 16px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #2563eb, #3b82f6) !important;
      color: #ffffff !important;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25) !important;
      border: none !important;
    }
    .msg-row.assistant .msg-bubble {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm) !important;
    }
    .msg-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding-left: 2px;
    }
    .action-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11.5px;
      font-family: var(--font-sans);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .action-btn:hover {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }

    /* Progress Steps (stream-driven) */
    .progress-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }

    .step-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .step-pill.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .step-pill.done {
      background: var(--green-bg);
      color: var(--green-text);
      border-color: var(--green-border);
    }

    /* Blocked by policy & error cards */
    .policy-card {
      background: var(--red-bg);
      border: 1.5px solid var(--red-border);
      color: var(--red-text);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .policy-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .policy-code {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--red-border);
      background: var(--surface);
      color: var(--red-text);
    }

    .policy-reason {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .warn-card {
      background: var(--amber-bg);
      border: 1.5px solid var(--amber-border);
      color: var(--amber-text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .warn-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    /* Structured Response Templates */
    .answer-prose h3,
    .answer-prose h4 {
      margin: 10px 0 6px;
      line-height: 1.3;
      color: var(--text);
    }
    .answer-prose h3 { font-size: 15px; }
    .answer-prose h4 { font-size: 13.5px; color: var(--accent); }
    .answer-prose p {
      margin: 0 0 8px;
    }
    .answer-prose p:last-child { margin-bottom: 0; }
    .answer-prose ul {
      margin: 4px 0 8px;
      padding-left: 20px;
    }
    .answer-prose li {
      margin-bottom: 4px;
    }
    .answer-prose code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .tpl-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      padding: 13px 14px;
      margin-top: 6px;
    }

    .tpl-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tpl-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
    }

    .tpl-code {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px 14px;
      margin-top: 6px;
    }

    .kv-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .kv-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .kv-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .phone-note {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      font-weight: 500;
      color: var(--amber-text);
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: 6px;
      padding: 2px 7px;
      width: fit-content;
    }

    .tpl-summary {
      font-size: 13.5px;
      color: var(--text);
      margin: 6px 0 8px;
      line-height: 1.5;
    }

    .sub-details {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .sub-details summary {
      cursor: pointer;
      padding: 8px 11px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sub-details summary::-webkit-details-marker { display: none; }
    .sub-details summary::after {
      content: "▸";
      color: var(--text-muted);
    }
    .sub-details[open] summary::after { content: "▾"; }

    .sub-details-body {
      padding: 8px 12px 10px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    .unit-item {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .unit-item:last-child { border-bottom: none; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    table.data-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      min-width: 420px;
    }

    table.data-tbl th,
    table.data-tbl td {
      padding: 7px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    table.data-tbl th {
      background: var(--surface-2);
      font-weight: 700;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-muted);
    }

    table.data-tbl tr:last-child td { border-bottom: none; }

    /* Choice chips for duplicate names/titles */
    .choice-wrap {
      margin-top: 10px;
    }

    .choice-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .choice-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-chip {
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      cursor: pointer;
      color: var(--text);
      font-family: var(--font-sans);
      transition: border-color 0.15s, background 0.15s;
      max-width: 100%;
    }

    .choice-chip:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .choice-chip-name {
      display: block;
      font-size: 13px;
      font-weight: 700;
    }

    .choice-chip-meta {
      display: block;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

        /* Evidence drawer - minimal & sleek */
    details.evidence-drawer {
      margin-top: 10px !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      background: var(--surface-2) !important;
      font-size: 12px !important;
      overflow: hidden;
      border-left: 2px solid var(--accent) !important;
    }

    details.evidence-drawer summary {
      cursor: pointer;
      padding: 6px 12px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      list-style: none;
      font-size: 12px;
      user-select: none;
    }

    details.evidence-drawer summary::-webkit-details-marker { display: none; }
    details.evidence-drawer summary::after {
      content: "Details ▸";
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }
    details.evidence-drawer[open] summary::after {
      content: "Hide ▾";
    }

    .evidence-grid {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px 14px;
      background: var(--surface);
    }

    .ev-cell-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .ev-cell-val {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text);
      margin-top: 2px;
      word-break: break-word;
    }

    .ev-span-2 {
      grid-column: 1 / -1;
    }

    .ev-pass { color: var(--green-text); font-weight: 700; }
    .ev-sub { color: var(--amber-text); font-weight: 700; }

        /* Composer */
    .composer-wrap {
      background: var(--bg);
      padding: 12px 16px 14px;
      border-top: none;
    }
    .composer-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 8px 6px 16px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .composer-inner:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md);
    }
    .composer-input {
      flex: 1;
      min-height: 32px;
      max-height: 120px;
      resize: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 6px 0;
      line-height: 1.45;
      outline: none;
    }
    .send-btn {
      width: 36px !important;
      height: 36px !important;
      padding: 0 !important;
      border-radius: 50% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: var(--accent) !important;
      color: #fff !important;
      border: none !important;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s !important;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35) !important;
    }
    .send-btn:hover {
      transform: scale(1.05) !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.45) !important;
    }
    .send-btn:active {
      transform: scale(0.95) !important;
    }
    .send-btn:disabled {
      opacity: 0.4 !important;
      cursor: not-allowed !important;
      transform: none !important;
      box-shadow: none !important;
    }
    .composer-hint {
      max-width: 800px;
      margin: 8px auto 0;
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

/* Mobile drawer backdrop */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 25;
    }

    /* ── GLOW-UP UPGRADE PACK ───────────────────────────────── */

    /* Animated gradient brand mark */
    
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      background: #000 !important;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35) !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: none !important;
    }
    .sidebar-logo-img, .hero-logo-img, .avatar-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: inherit;
    }
    .bot-badge-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.12);
      margin-bottom: 14px;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      margin-top: 2px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-mark {
      background: linear-gradient(135deg, #2563eb, #7c3aed, #0ea5e9) !important;
      background-size: 200% 200% !important;
      animation: gradShift 4s ease infinite !important;
      box-shadow: 0 0 14px rgba(99,102,241,0.45) !important;
    }
    @keyframes gradShift {
      0%   { background-position: 0%   50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }

    /* Sidebar: subtle left-edge glow */
    .sidebar {
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%) !important;
      box-shadow: 2px 0 20px rgba(37,99,235,0.07) !important;
    }

    /* Topbar: frosted glass */
    .topbar {
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      background: rgba(255,255,255,0.72) !important;
      border-bottom: 1px solid rgba(37,99,235,0.12) !important;
    }
    html[data-theme="dark"] .topbar {
      background: rgba(19,28,46,0.82) !important;
      border-bottom: 1px solid rgba(79,134,255,0.15) !important;
    }

    /* User bubble: gradient */
    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%) !important;
      box-shadow: 0 4px 18px rgba(37,99,235,0.35) !important;
      border: none !important;
    }

    /* Assistant bubble: elevated card */
    .msg-row.assistant .msg-bubble {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07), 0 0 0 1px rgba(37,99,235,0.04) !important;
      transition: box-shadow 0.2s !important;
    }
    .msg-row.assistant .msg-bubble:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.11), 0 0 0 1px rgba(37,99,235,0.08) !important;
    }

    /* Step pills: glowing active */
    .step-pill.active {
      background: linear-gradient(90deg, rgba(37,99,235,0.15), rgba(124,58,237,0.15)) !important;
      border-color: rgba(99,102,241,0.6) !important;
      color: var(--accent) !important;
      box-shadow: 0 0 10px rgba(99,102,241,0.2) !important;
    }
    .step-pill.done {
      background: linear-gradient(90deg, rgba(16,185,129,0.1), rgba(5,150,105,0.1)) !important;
    }

    /* Send button: gradient + glow */
    .send-btn {
      background: linear-gradient(135deg, #2563eb, #4f46e5) !important;
      border-color: transparent !important;
      box-shadow: 0 4px 14px rgba(37,99,235,0.4) !important;
      transition: box-shadow 0.2s, transform 0.1s !important;
    }
    .send-btn:hover {
      box-shadow: 0 6px 20px rgba(37,99,235,0.55) !important;
      transform: translateY(-1px) !important;
    }
    .send-btn:active {
      transform: translateY(0) !important;
      box-shadow: 0 2px 8px rgba(37,99,235,0.35) !important;
    }

    /* Textarea: glow on focus */
    .composer-box textarea:focus {
      border-color: rgba(99,102,241,0.6) !important;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12), 0 2px 8px rgba(0,0,0,0.06) !important;
      outline: none !important;
    }

    /* Evidence drawer: accent left border */
    details.evidence-drawer {
      border-left: 3px solid rgba(99,102,241,0.4) !important;
      border-radius: 0 8px 8px 0 !important;
      padding-left: 10px !important;
      margin-top: 10px !important;
    }

    /* New chat button: gradient */
    .new-chat-wrap .btn {
      background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(124,58,237,0.08)) !important;
      border-color: rgba(99,102,241,0.3) !important;
      color: var(--accent) !important;
      font-weight: 700 !important;
    }
    .new-chat-wrap .btn:hover {
      background: linear-gradient(135deg, rgba(37,99,235,0.18), rgba(124,58,237,0.14)) !important;
    }

    /* Policy/security block card: glow */
    .policy-card {
      border-left: 4px solid #ef4444 !important;
      box-shadow: 0 0 16px rgba(239,68,68,0.12) !important;
    }

    /* Smooth message row slide-in */
    .msg-row {
      animation: slideUp 0.22s ease-out !important;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── END GLOW-UP ────────────────────────────────────────── */

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-md);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .backdrop.open {
        display: block;
      }
      .menu-btn {
        display: inline-flex;
      }
      .topbar {
        padding: 8px 10px;
      }
      .chat-scroll {
        padding: 12px 10px 18px;
      }
      .msg-row.user .msg-bubble {
        max-width: 92%;
      }
      .starter-grid {
        grid-template-columns: 1fr;
      }
      .composer-wrap {
        padding: 8px 10px 10px;
      }
      .send-btn {
        padding: 0 13px;
      }
    }
  </style>
</head>

      // Strict HTML escaping: prevents any injected tags/scripts from executing
      function escapeHtml(val) {
        if (val === null || val === undefined) return "";
        return String(val)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Safe markdown formatting AFTER escaping every character of raw text
      function renderSafeMarkdown(rawText) {
        const escaped = escapeHtml(rawText || "");
        const lines = escaped.split(/\r?\n/);
        const html = [];
        let inList = false;

        function inlineFmt(s) {
          return s
            .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
            .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
            .replace(/`([^`\n]+)`/g, "<code>$1</code>");
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) {
            if (inList) {
              html.push("</ul>");
              inList = false;
            }
            continue;
          }
          if (/^####\s+/.test(line)) {
            if (inList) { html.push("</ul>"); inList = false; }
            html.push("<h4>" + inlineFmt(line.replace(/^####\s+/, "")) + "</h4>");
          } else if (/^#{1,3}\s+/.test(line)) {
            if (inList) { html.push("</ul>"); inList = false; }
            html.push("<h3>" + inlineFmt(line.replace(/^#{1,3}\s+/, "")) + "</h3>");
          } else if (/^[-*]\s+/.test(line)) {
            if (!inList) {
              html.push("<ul>");
              inList = true;
            }
            html.push("<li>" + inlineFmt(line.replace(/^[-*]\s+/, "")) + "</li>");
          } else {
            if (inList) {
              html.push("</ul>");
              inList = false;
            }
            html.push("<p>" + inlineFmt(line) + "</p>");
          }
        }
        if (inList) html.push("</ul>");
        return '<div class="answer-prose">' + html.join("") + "</div>";
      }
