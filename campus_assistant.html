<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRMIST Campus Knowledge Assistant</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, Monaco, monospace;

      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #f0f3f9;
      --surface-3: #e6ecf5;
      --border: #d8e0ec;
      --text: #162033;
      --text-muted: #55647d;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: #e8f0fe;
      --user-bubble: #1d4ed8;
      --user-text: #ffffff;

      --green-bg: #e7f8ef;
      --green-border: #86d9ab;
      --green-text: #0f6b3e;

      --amber-bg: #fff5e0;
      --amber-border: #f0c05a;
      --amber-text: #8a5200;

      --red-bg: #fef0f0;
      --red-border: #f2a2a2;
      --red-text: #991b1b;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
      --radius: 12px;
      --sidebar-w: 272px;
    }

    html[data-theme="dark"] {
      --bg: #0c1220;
      --surface: #131c2e;
      --surface-2: #1a253b;
      --surface-3: #22304c;
      --border: #2a3a57;
      --text: #edf2fb;
      --text-muted: #98a9c4;
      --accent: #4f86ff;
      --accent-hover: #3b72eb;
      --accent-soft: rgba(79, 134, 255, 0.16);
      --user-bubble: #2563eb;
      --user-text: #ffffff;

      --green-bg: rgba(22, 163, 74, 0.16);
      --green-border: rgba(74, 222, 128, 0.45);
      --green-text: #7ef0a6;

      --amber-bg: rgba(245, 158, 11, 0.16);
      --amber-border: rgba(251, 191, 36, 0.5);
      --amber-text: #fcd36a;

      --red-bg: rgba(220, 38, 38, 0.16);
      --red-border: rgba(248, 113, 113, 0.5);
      --red-text: #fca5a5;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 30;
      transition: transform 0.2s ease;
    }

    .sidebar-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      letter-spacing: 0.4px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 7px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover { background: var(--surface-3); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-icon {
      padding: 6px 8px;
      font-size: 14px;
    }

    .new-chat-wrap {
      padding: 12px 14px 8px;
    }

    .new-chat-wrap .btn {
      width: 100%;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      border: 1px solid transparent;
    }

    .session-item:hover {
      background: var(--surface-2);
    }

    .session-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      font-weight: 600;
    }

    .session-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-del {
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 5px;
      border-radius: 5px;
      line-height: 1;
    }

    .session-del:hover {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .sidebar-footer {
      padding: 10px 14px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-footer-row {
      display: flex;
      gap: 8px;
    }

    .sidebar-footer-row .btn {
      flex: 1;
      font-size: 12px;
      padding: 6px 8px;
    }

    /* Main Workspace */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .menu-btn {
      display: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      white-space: nowrap;
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .badge-green {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
    }

    .badge-amber {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }

    .badge-role {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    /* Chat area */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 24px;
    }

    .chat-inner {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Welcome & dynamic starter chips */
    .welcome {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 20px;
      box-shadow: var(--shadow-sm);
    }

    .welcome h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.25;
    }

    .welcome p {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .starter-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .starter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
    }

    .starter-chip {
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      color: var(--text);
      font-family: var(--font-sans);
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }

    .starter-chip:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .starter-chip-tool {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 5px;
      margin-bottom: 5px;
    }

    .starter-chip-q {
      display: block;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    /* Message rows */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-row.user {
      align-items: flex-end;
    }

    .msg-row.assistant {
      align-items: flex-start;
    }

    .msg-bubble {
      max-width: 100%;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      max-width: 82%;
      border-bottom-right-radius: 4px;
    }

    .msg-row.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      width: 100%;
      box-shadow: var(--shadow-sm);
      border-bottom-left-radius: 4px;
    }

    /* Progress Steps (stream-driven) */
    .progress-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }

    .step-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .step-pill.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .step-pill.done {
      background: var(--green-bg);
      color: var(--green-text);
      border-color: var(--green-border);
    }

    /* Blocked by policy & error cards */
    .policy-card {
      background: var(--red-bg);
      border: 1.5px solid var(--red-border);
      color: var(--red-text);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .policy-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .policy-code {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--red-border);
      background: var(--surface);
      color: var(--red-text);
    }

    .policy-reason {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .warn-card {
      background: var(--amber-bg);
      border: 1.5px solid var(--amber-border);
      color: var(--amber-text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .warn-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    /* Structured Response Templates */
    .answer-prose h3,
    .answer-prose h4 {
      margin: 10px 0 6px;
      line-height: 1.3;
      color: var(--text);
    }
    .answer-prose h3 { font-size: 15px; }
    .answer-prose h4 { font-size: 13.5px; color: var(--accent); }
    .answer-prose p {
      margin: 0 0 8px;
    }
    .answer-prose p:last-child { margin-bottom: 0; }
    .answer-prose ul {
      margin: 4px 0 8px;
      padding-left: 20px;
    }
    .answer-prose li {
      margin-bottom: 4px;
    }
    .answer-prose code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .tpl-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      padding: 13px 14px;
      margin-top: 6px;
    }

    .tpl-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tpl-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
    }

    .tpl-code {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px 14px;
      margin-top: 6px;
    }

    .kv-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .kv-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .kv-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .phone-note {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      font-weight: 500;
      color: var(--amber-text);
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: 6px;
      padding: 2px 7px;
      width: fit-content;
    }

    .tpl-summary {
      font-size: 13.5px;
      color: var(--text);
      margin: 6px 0 8px;
      line-height: 1.5;
    }

    .sub-details {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .sub-details summary {
      cursor: pointer;
      padding: 8px 11px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sub-details summary::-webkit-details-marker { display: none; }
    .sub-details summary::after {
      content: "▸";
      color: var(--text-muted);
    }
    .sub-details[open] summary::after { content: "▾"; }

    .sub-details-body {
      padding: 8px 12px 10px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    .unit-item {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .unit-item:last-child { border-bottom: none; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    table.data-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      min-width: 420px;
    }

    table.data-tbl th,
    table.data-tbl td {
      padding: 7px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    table.data-tbl th {
      background: var(--surface-2);
      font-weight: 700;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-muted);
    }

    table.data-tbl tr:last-child td { border-bottom: none; }

    /* Choice chips for duplicate names/titles */
    .choice-wrap {
      margin-top: 10px;
    }

    .choice-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .choice-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-chip {
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      cursor: pointer;
      color: var(--text);
      font-family: var(--font-sans);
      transition: border-color 0.15s, background 0.15s;
      max-width: 100%;
    }

    .choice-chip:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .choice-chip-name {
      display: block;
      font-size: 13px;
      font-weight: 700;
    }

    .choice-chip-meta {
      display: block;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Evidence drawer (collapsed by default) */
    details.evidence-drawer {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      font-size: 12px;
    }

    details.evidence-drawer summary {
      cursor: pointer;
      padding: 7px 11px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      list-style: none;
    }

    details.evidence-drawer summary::-webkit-details-marker { display: none; }
    details.evidence-drawer summary::after { content: "Show details ▸"; font-size: 11px; }
    details.evidence-drawer[open] summary::after { content: "Hide details ▾"; }

    .evidence-grid {
      border-top: 1px solid var(--border);
      padding: 10px 11px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 8px 12px;
      background: var(--surface);
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .ev-cell-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .ev-cell-val {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text);
      margin-top: 2px;
      word-break: break-word;
    }

    .ev-span-2 {
      grid-column: 1 / -1;
    }

    .ev-pass { color: var(--green-text); font-weight: 700; }
    .ev-sub { color: var(--amber-text); font-weight: 700; }

    /* Composer */
    .composer-wrap {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px 12px;
    }

    .composer-inner {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .composer-input {
      flex: 1;
      min-height: 44px;
      max-height: 140px;
      resize: none;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 10px 12px;
      line-height: 1.4;
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--accent);
      background: var(--surface);
    }

    .send-btn {
      height: 44px;
      padding: 0 18px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .composer-hint {
      max-width: 880px;
      margin: 6px auto 0;
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Mobile drawer backdrop */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 25;
    }

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-md);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .backdrop.open {
        display: block;
      }
      .menu-btn {
        display: inline-flex;
      }
      .topbar {
        padding: 8px 10px;
      }
      .chat-scroll {
        padding: 12px 10px 18px;
      }
      .msg-row.user .msg-bubble {
        max-width: 92%;
      }
      .starter-grid {
        grid-template-columns: 1fr;
      }
      .composer-wrap {
        padding: 8px 10px 10px;
      }
      .send-btn {
        padding: 0 13px;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Chat sessions">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark">SRM</div>
          <div class="brand-text">
            <div class="brand-title">Campus Assistant</div>
            <div class="brand-sub">Governed Knowledge Graph</div>
          </div>
        </div>
        <button class="btn btn-icon menu-btn" id="closeSidebarBtn" type="button" aria-label="Close menu">&times;</button>
      </div>

      <div class="new-chat-wrap">
        <button class="btn btn-primary" id="newChatBtn" type="button">+ New Chat</button>
      </div>

      <div class="session-list" id="sessionList"></div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-row">
          <button class="btn" id="themeBtn" type="button">Theme: Light</button>
          <a class="btn" href="/audit.html">Admin Audit</a>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-icon menu-btn" id="openSidebarBtn" type="button" aria-label="Open sessions">&#9776;</button>
          <span class="badge badge-amber" id="engineBadge" title="Refreshed from /health every 30 seconds">
            <span class="dot"></span>
            <span id="engineBadgeText">Checking engine...</span>
          </span>
          <span class="badge badge-role" id="roleBadge">Role: Student</span>
        </div>

        <div class="topbar-right">
          <div class="mode-switch" role="group" aria-label="Routing mode">
            <button class="mode-btn active" id="modeHybridBtn" type="button" title="Default router-first: heuristic router -> Qwen fallback -> clarification">Router-First</button>
            <button class="mode-btn" id="modeIntentBtn" type="button" title="Optional experimental mode: Qwen intent classification first">LLM Intent (Experimental)</button>
          </div>
          <button class="btn" id="proseToggleBtn" type="button" style="font-size:12px;padding:5px 9px;" title="Toggle Qwen 2.5 conversational prose writing">Prose: Off</button>
        </div>
      </header>

      <section class="chat-scroll" id="chatScroll">
        <div class="chat-inner" id="chatInner"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer-inner" id="chatForm">
          <textarea
            id="queryInput"
            class="composer-input"
            rows="1"
            placeholder="Ask about courses, prerequisites, faculty, rooms, curriculum, or admissions..."
            aria-label="Campus question"
          ></textarea>
          <button class="btn btn-primary send-btn" id="sendBtn" type="submit">Send</button>
        </form>
        <div class="composer-hint">
          <span>Anonymous access runs under least-privilege Student policy (25-row cap, private fields masked).</span>
          <span id="modeHint">Mode: Instant (~65 ms structured)</span>
        </div>
      </footer>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      const API_BASE = window.location.protocol.startsWith("http")
        ? window.location.origin
        : "http://localhost:8000";

      const STORAGE_SESSIONS_KEY = "srmist_assistant_sessions_v2";
      const STORAGE_THEME_KEY = "srmist_assistant_theme_v2";
      const STORAGE_ROUTING_KEY = "srmist_assistant_routing_v3";
      const STORAGE_PROSE_KEY = "srmist_assistant_prose_v3";
      const REQUEST_TIMEOUT_MS = 45000;
      const HEALTH_POLL_MS = 30000;

      let sessions = [];
      let activeSessionId = null;
      let isSending = false;
      let routingMode = "hybrid";
      let useQwenProse = false;
      let dynamicStarters = [];
      let currentEngineLabel = "Fallback (not graph data)";

      // DOM refs
      const sidebarEl = document.getElementById("sidebar");
      const backdropEl = document.getElementById("backdrop");
      const openSidebarBtn = document.getElementById("openSidebarBtn");
      const closeSidebarBtn = document.getElementById("closeSidebarBtn");
      const newChatBtn = document.getElementById("newChatBtn");
      const sessionListEl = document.getElementById("sessionList");
      const themeBtn = document.getElementById("themeBtn");
      const engineBadgeEl = document.getElementById("engineBadge");
      const engineBadgeTextEl = document.getElementById("engineBadgeText");
      const modeHybridBtn = document.getElementById("modeHybridBtn");
      const modeIntentBtn = document.getElementById("modeIntentBtn");
      const proseToggleBtn = document.getElementById("proseToggleBtn");
      const modeHintEl = document.getElementById("modeHint");
      const chatScrollEl = document.getElementById("chatScroll");
      const chatInnerEl = document.getElementById("chatInner");
      const chatForm = document.getElementById("chatForm");
      const queryInput = document.getElementById("queryInput");
      const sendBtn = document.getElementById("sendBtn");

      // Strict HTML escaping: prevents any injected tags/scripts from executing
      function escapeHtml(val) {
        if (val === null || val === undefined) return "";
        return String(val)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Safe markdown formatting AFTER escaping every character of raw text
      function renderSafeMarkdown(rawText) {
        const escaped = escapeHtml(rawText || "");
        const lines = escaped.split(/\r?\n/);
        const html = [];
        let inList = false;

        function inlineFmt(s) {
          return s
            .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
            .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
            .replace(/`([^`\n]+)`/g, "<code>$1</code>");
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) {
            if (inList) {
              html.push("</ul>");
              inList = false;
            }
            continue;
          }
          if (/^####\s+/.test(line)) {
            if (inList) { html.push("</ul>"); inList = false; }
            html.push("<h4>" + inlineFmt(line.replace(/^####\s+/, "")) + "</h4>");
          } else if (/^#{1,3}\s+/.test(line)) {
            if (inList) { html.push("</ul>"); inList = false; }
            html.push("<h3>" + inlineFmt(line.replace(/^#{1,3}\s+/, "")) + "</h3>");
          } else if (/^[-*]\s+/.test(line)) {
            if (!inList) {
              html.push("<ul>");
              inList = true;
            }
            html.push("<li>" + inlineFmt(line.replace(/^[-*]\s+/, "")) + "</li>");
          } else {
            if (inList) {
              html.push("</ul>");
              inList = false;
            }
            html.push("<p>" + inlineFmt(line) + "</p>");
          }
        }
        if (inList) html.push("</ul>");
        return '<div class="answer-prose">' + html.join("") + "</div>";
      }

      // Theme persistence
      function applyTheme(theme) {
        const t = theme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        themeBtn.textContent = t === "dark" ? "Theme: Dark" : "Theme: Light";
        try { localStorage.setItem(STORAGE_THEME_KEY, t); } catch (_) {}
      }

      function applyModeUI() {
        const isIntent = routingMode === "llm_intent";
        modeHybridBtn.classList.toggle("active", !isIntent);
        modeIntentBtn.classList.toggle("active", isIntent);
        proseToggleBtn.textContent = useQwenProse ? "Prose: On" : "Prose: Off";
        proseToggleBtn.style.borderColor = useQwenProse ? "var(--accent)" : "";
        proseToggleBtn.style.color = useQwenProse ? "var(--accent)" : "";
        modeHintEl.textContent = isIntent
          ? ("Mode: LLM Intent (Experimental — Qwen intent first" + (useQwenProse ? " + Qwen prose)" : ")"))
          : ("Mode: Router-First (Default — heuristic -> Qwen fallback -> clarify" + (useQwenProse ? " + Qwen prose)" : ")"));
        try {
          localStorage.setItem(STORAGE_ROUTING_KEY, routingMode);
          localStorage.setItem(STORAGE_PROSE_KEY, useQwenProse ? "1" : "0");
        } catch (_) {}
      }

      // Sessions
      function uid() {
        return "sess_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
      }

      function saveSessions() {
        try { localStorage.setItem(STORAGE_SESSIONS_KEY, JSON.stringify(sessions)); } catch (_) {}
      }

      function loadSessions() {
        try {
          const raw = localStorage.getItem(STORAGE_SESSIONS_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              sessions = parsed;
              activeSessionId = sessions[0].id;
              return;
            }
          }
        } catch (_) {}
        const fresh = { id: uid(), title: "New Chat", messages: [] };
        sessions = [fresh];
        activeSessionId = fresh.id;
      }

      function getActiveSession() {
        let s = sessions.find(function (x) { return x.id === activeSessionId; });
        if (!s) {
          s = { id: uid(), title: "New Chat", messages: [] };
          sessions.unshift(s);
          activeSessionId = s.id;
        }
        return s;
      }

      function createSession() {
        const s = { id: uid(), title: "New Chat", messages: [] };
        sessions.unshift(s);
        activeSessionId = s.id;
        saveSessions();
        renderSessions();
        renderChat();
        closeSidebar();
      }

      function deleteSession(id) {
        sessions = sessions.filter(function (x) { return x.id !== id; });
        if (sessions.length === 0) {
          const s = { id: uid(), title: "New Chat", messages: [] };
          sessions.push(s);
        }
        if (activeSessionId === id) {
          activeSessionId = sessions[0].id;
        }
        saveSessions();
        renderSessions();
        renderChat();
      }

      function renderSessions() {
        sessionListEl.innerHTML = "";
        sessions.forEach(function (s) {
          const row = document.createElement("div");
          row.className = "session-item" + (s.id === activeSessionId ? " active" : "");
          row.addEventListener("click", function () {
            activeSessionId = s.id;
            renderSessions();
            renderChat();
            closeSidebar();
          });

          const titleSpan = document.createElement("span");
          titleSpan.className = "session-title";
          titleSpan.textContent = s.title || "New Chat";

          const delBtn = document.createElement("button");
          delBtn.className = "session-del";
          delBtn.type = "button";
          delBtn.title = "Delete chat";
          delBtn.textContent = "\u00d7";
          delBtn.addEventListener("click", function (ev) {
            ev.stopPropagation();
            deleteSession(s.id);
          });

          row.appendChild(titleSpan);
          row.appendChild(delBtn);
          sessionListEl.appendChild(row);
        });
      }

      // Health badge (refreshed every 30s)
      async function refreshHealth() {
        try {
          const ctrl = new AbortController();
          const tid = setTimeout(function () { ctrl.abort(); }, 5000);
          const resp = await fetch(API_BASE + "/health", { signal: ctrl.signal, cache: "no-store" });
          clearTimeout(tid);
          if (!resp.ok) throw new Error("Health status " + resp.status);
          const data = await resp.json();
          if (data.neo4j_connected) {
            const ver = data.neo4j_version ? ("Community " + data.neo4j_version) : "Community";
            const label = data.engine || ("Live Neo4j (" + ver + ")");
            currentEngineLabel = label;
            engineBadgeEl.className = "badge badge-green";
            engineBadgeTextEl.textContent = label;
          } else {
            currentEngineLabel = "Fallback (not graph data)";
            engineBadgeEl.className = "badge badge-amber";
            engineBadgeTextEl.textContent = "Fallback (not graph data)";
          }
        } catch (_) {
          currentEngineLabel = "Fallback (not graph data)";
          engineBadgeEl.className = "badge badge-amber";
          engineBadgeTextEl.textContent = "Fallback (not graph data)";
        }
      }

      // Build 6 starter chips dynamically from /tools/registry (not hardcoded!)
      async function loadStarterChipsFromRegistry() {
        try {
          const resp = await fetch(API_BASE + "/tools/registry", { cache: "no-store" });
          if (!resp.ok) return;
          const reg = await resp.json();
          const tools = Array.isArray(reg.tools) ? reg.tools : [];
          const samples = reg.samples || {};
          const available = new Set(tools.map(function (t) { return t.name; }));

          const builders = [
            {
              tool: "lookup_course",
              build: function () {
                return samples.course_code ? ("Course details and syllabus for " + samples.course_code) : null;
              }
            },
            {
              tool: "get_prerequisite_tree",
              build: function () {
                return samples.prereq_course_code ? ("Show prerequisite tree for " + samples.prereq_course_code) : null;
              }
            },
            {
              tool: "find_faculty_for_course",
              build: function () {
                const code = samples.taught_course_code || samples.course_code;
                return code ? ("Who teaches " + code + "?") : null;
              }
            },
            {
              tool: "lookup_faculty_profile",
              build: function () {
                return samples.faculty_name ? ("Profile and cabin for " + samples.faculty_name) : null;
              }
            },
            {
              tool: "find_available_rooms",
              build: function () {
                return samples.building_name ? ("Find available rooms in " + samples.building_name) : null;
              }
            },
            {
              tool: "get_semester_curriculum",
              build: function () {
                if (samples.program_name && samples.semester) {
                  return samples.program_name + " Semester " + samples.semester + " curriculum";
                }
                return null;
              }
            },
            {
              tool: "find_room_schedule",
              build: function () {
                return samples.room_id ? ("Show timetable for room " + samples.room_id) : null;
              }
            },
            {
              tool: "get_campus_statistics",
              build: function () {
                return "Campus graph summary statistics";
              }
            },
            {
              tool: "lookup_building",
              build: function () {
                return samples.building_name ? ("Tell me about " + samples.building_name) : null;
              }
            }
          ];

          const chosen = [];
          for (let i = 0; i < builders.length && chosen.length < 6; i++) {
            const b = builders[i];
            if (!available.has(b.tool)) continue;
            const q = b.build();
            if (q) {
              chosen.push({ tool: b.tool, query: q });
            }
          }
          dynamicStarters = chosen;
          const active = getActiveSession();
          if (active.messages.length === 0) {
            renderChat();
          }
        } catch (_) {}
      }

      // Structured response templates (strictly escaped)
      function renderStructuredBody(msg) {
        // Blocked by policy card
        const blockedStatuses = {
          POLICY_VIOLATION: true,
          VALIDATION_ERROR: true,
          ROLE_SPOOFING_BLOCKED: true,
          FORBIDDEN_TOOL_FOR_ROLE: true
        };
        if (blockedStatuses[msg.status]) {
          const reason = msg.detail || msg.answer || "This request was blocked by security policy.";
          return (
            '<div class="policy-card">' +
              '<div class="policy-card-head">' +
                '<span>Blocked by policy</span>' +
                '<span class="policy-code">' + escapeHtml(msg.status) + '</span>' +
              '</div>' +
              '<p class="policy-reason">' + escapeHtml(reason) + '</p>' +
            '</div>'
          );
        }

        // Write-request refusal card (distinct status WRITE_REQUEST_REFUSED — never a greeting)
        if (msg.status === "WRITE_REQUEST_REFUSED") {
          return (
            '<div class="warn-card">' +
              '<strong>Read-only assistant (WRITE_REQUEST_REFUSED)</strong>' +
              '<span>' + escapeHtml(msg.answer || "I can only read campus data; I can\u2019t add, change or delete records") + '</span>' +
            '</div>'
          );
        }

        // Plain HTTP / rate-limit / timeout warning card
        if (msg.errorType === "HTTP_WARNING") {
          return (
            '<div class="warn-card">' +
              '<strong>' + escapeHtml(msg.errorTitle || "Notice") + '</strong>' +
              '<span>' + escapeHtml(msg.answer || "") + '</span>' +
            '</div>'
          );
        }

        const tool = msg.tool || "";
        const tr = msg.toolResult;

        // If Qwen Prose mode produced streamed prose, show escaped prose + verbatim phone_note if any
        if (msg.useQwen && msg.answer) {
          let extra = "";
          if (tool === "lookup_faculty_profile" && tr && Array.isArray(tr.faculty) && tr.faculty.length === 1) {
            const note = tr.faculty[0].phone_note;
            if (note) {
              extra = '<div style="margin-top:8px;"><span class="phone-note">Phone note: ' + escapeHtml(note) + '</span></div>';
            }
          }
          return renderSafeMarkdown(msg.answer) + extra;
        }

        // Process 004 projected / filtered follow-up: render the clean ChatGPT-style grounded markdown directly
        // so include/exclude filters ("remove credits and course outcomes", "what is her area of research") are honored verbatim
        if (tr && tr.projection && msg.answer) {
          let extra = "";
          if (tool === "lookup_faculty_profile" && Array.isArray(tr.faculty) && tr.faculty.length === 1) {
            const excl = (tr.projection.excluded_fields || []);
            const inc = tr.projection.mode === "include" ? (tr.projection.fields || []) : null;
            const phoneAllowed = excl.indexOf("phone") === -1 && (inc === null || inc.indexOf("phone") !== -1);
            if (phoneAllowed && tr.faculty[0].phone_note) {
              extra = '<div style="margin-top:8px;"><span class="phone-note">Phone note: ' + escapeHtml(tr.faculty[0].phone_note) + '</span></div>';
            }
          }
          return renderSafeMarkdown(msg.answer) + extra;
        }

        // Structured Course Card (single course)
        if (tool === "lookup_course" && tr && Array.isArray(tr.courses) && tr.courses.length === 1) {
          const c = tr.courses[0];
          const pills = [];
          if (c.credits !== undefined && c.credits !== null) pills.push("Credits: " + c.credits);
          if (c.ltpc) pills.push("L-T-P-C: " + c.ltpc);
          if (c.category) pills.push(c.category);
          if (c.level) pills.push(c.level);
          if (c.department) pills.push(c.department);

          let html = '<div class="tpl-card">';
          html += '<div class="tpl-head">' +
            '<span class="tpl-title">' + escapeHtml(c.name || c.code) + '</span>' +
            '<span class="tpl-code">' + escapeHtml(c.code || "") + '</span>' +
          '</div>';

          if (pills.length) {
            html += '<div class="pill-row">' + pills.map(function (p) {
              return '<span class="pill">' + escapeHtml(p) + '</span>';
            }).join("") + '</div>';
          }

          const ratArr = Array.isArray(c.course_rationale) ? c.course_rationale : [];
          const summaryText = ratArr.length ? ratArr.join(" ") : (c.description || "");
          if (summaryText) {
            html += '<div class="tpl-summary">' + escapeHtml(summaryText) + '</div>';
          }

          if (Array.isArray(c.course_outcomes) && c.course_outcomes.length) {
            html += '<details class="sub-details"><summary>Course Outcomes (' + c.course_outcomes.length + ')</summary><div class="sub-details-body"><ul>';
            c.course_outcomes.forEach(function (co) {
              const label = typeof co === "object" && co !== null
                ? ((co.id ? co.id + ": " : "") + (co.description || co.text || JSON.stringify(co)))
                : String(co);
              html += '<li>' + escapeHtml(label) + '</li>';
            });
            html += '</ul></div></details>';
          }

          if (Array.isArray(c.syllabus_units) && c.syllabus_units.length) {
            html += '<details class="sub-details"><summary>Syllabus Units (' + c.syllabus_units.length + ')</summary><div class="sub-details-body">';
            c.syllabus_units.forEach(function (u) {
              const uTitle = (u.unit ? ("Unit " + u.unit + ": ") : "") + (u.title || "");
              const hrs = u.hours ? (" (" + u.hours + " hrs)") : "";
              html += '<div class="unit-item"><strong>' + escapeHtml(uTitle + hrs) + '</strong>';
              if (u.topics) html += '<div style="margin-top:3px;color:var(--text-muted);">' + escapeHtml(u.topics) + '</div>';
              html += '</div>';
            });
            html += '</div></details>';
          }

          if (Array.isArray(c.textbooks) && c.textbooks.length) {
            html += '<details class="sub-details"><summary>Textbooks &amp; References (' + c.textbooks.length + ')</summary><div class="sub-details-body"><ul>';
            c.textbooks.forEach(function (tb) {
              html += '<li>' + escapeHtml(tb) + '</li>';
            });
            html += '</ul></div></details>';
          }

          if (Array.isArray(c.prerequisites) && c.prerequisites.length) {
            html += '<details class="sub-details"><summary>Prerequisites (' + c.prerequisites.length + ')</summary><div class="sub-details-body"><ul>';
            c.prerequisites.forEach(function (pr) {
              const txt = typeof pr === "object" && pr !== null
                ? ((pr.code || pr.prerequisite_code || "") + (pr.name ? (" — " + pr.name) : ""))
                : String(pr);
              html += '<li>' + escapeHtml(txt) + '</li>';
            });
            html += '</ul></div></details>';
          }

          if (Array.isArray(c.offered_in) && c.offered_in.length) {
            html += '<details class="sub-details"><summary>Offered In (' + c.offered_in.length + ' program allocations)</summary><div class="sub-details-body"><ul>';
            c.offered_in.slice(0, 15).forEach(function (o) {
              const txt = typeof o === "object" && o !== null
                ? ("Semester " + (o.semester !== undefined ? o.semester : "?") + " — " + (o.program || ""))
                : String(o);
              html += '<li>' + escapeHtml(txt) + '</li>';
            });
            if (c.offered_in.length > 15) {
              html += '<li><em>...and ' + escapeHtml(c.offered_in.length - 15) + ' more allocations</em></li>';
            }
            html += '</ul></div></details>';
          }

          if (!c.has_detailed_syllabus) {
            html += '<div style="margin-top:10px;font-size:12px;color:var(--text-muted);font-style:italic;">' +
              'Detailed unit-by-unit syllabus chapters &amp; textbooks are not present in the indexed Regulations-2021 syllabus PDF for this course (190 of 669 courses include full chapter syllabi).' +
            '</div>';
          }

          html += '</div>';
          return html;
        }

        // Multi-name faculty lookup: render all per-name sections cleanly
        if (tr && Array.isArray(tr.multi_name_queries) && tr.multi_name_queries.length >= 2 && msg.answer) {
          return renderSafeMarkdown(msg.answer);
        }

        // Structured Single Faculty Profile Card (with verbatim phone_note!)
        if (tool === "lookup_faculty_profile" && tr && Array.isArray(tr.faculty) && tr.faculty.length === 1) {
          const f = tr.faculty[0];
          const dept = f.normalized_department || f.department || "Not listed";
          const phoneVal = (f.phone && String(f.phone).trim()) ? String(f.phone).trim() : "—";
          const phoneNoteHtml = f.phone_note
            ? '<span class="phone-note">' + escapeHtml(f.phone_note) + '</span>'
            : '';

          let html = '<div class="tpl-card">';
          html += '<div class="tpl-head">' +
            '<span class="tpl-title">' + escapeHtml(f.name || "Faculty Member") + '</span>' +
            (f.id ? '<span class="tpl-code">' + escapeHtml(f.id) + '</span>' : '') +
          '</div>';
          if (f.designation) {
            html += '<div class="pill-row"><span class="pill">' + escapeHtml(f.designation) + '</span></div>';
          }
          html += '<div class="kv-grid">';
          html += '<div class="kv-item"><div class="kv-label">Department</div><div class="kv-val">' + escapeHtml(dept) + '</div></div>';
          html += '<div class="kv-item"><div class="kv-label">Cabin</div><div class="kv-val">' + escapeHtml(f.cabin || "Not listed") + '</div></div>';
          html += '<div class="kv-item"><div class="kv-label">Email</div><div class="kv-val">' + escapeHtml(f.email || "Not listed") + '</div></div>';
          html += '<div class="kv-item"><div class="kv-label">Official Directory Phone</div><div class="kv-val">' + escapeHtml(phoneVal) + phoneNoteHtml + '</div></div>';
          if (f.specialization) {
            html += '<div class="kv-item ev-span-2"><div class="kv-label">Specialization</div><div class="kv-val">' + escapeHtml(f.specialization) + '</div></div>';
          }
          if (f.experience) {
            html += '<div class="kv-item"><div class="kv-label">Experience</div><div class="kv-val">' + escapeHtml(f.experience) + '</div></div>';
          }
          html += '</div></div>';
          return html;
        }

        // Structured Course Instructors Table
        if (tool === "find_faculty_for_course" && tr && Array.isArray(tr.instructors) && tr.instructors.length > 0) {
          let html = '<div class="tpl-card">';
          html += '<div class="tpl-head"><span class="tpl-title">Instructors for ' + escapeHtml(tr.course_code || "") + '</span>' +
            '<span class="pill">' + escapeHtml(tr.instructors.length) + ' listed</span></div>';
          html += '<div class="table-wrap"><table class="data-tbl"><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Cabin</th></tr></thead><tbody>';
          tr.instructors.forEach(function (ins) {
            html += '<tr>' +
              '<td><code>' + escapeHtml(ins.id || "—") + '</code></td>' +
              '<td><strong>' + escapeHtml(ins.name || "") + '</strong>' + (ins.designation ? ('<br><span style="color:var(--text-muted);font-size:11.5px;">' + escapeHtml(ins.designation) + '</span>') : '') + '</td>' +
              '<td>' + escapeHtml(ins.normalized_department || ins.department || "—") + '</td>' +
              '<td>' + escapeHtml(ins.cabin || "—") + '</td>' +
            '</tr>';
          });
          html += '</tbody></table></div></div>';
          return html;
        }

        // Structured Available Rooms Table
        if (tool === "find_available_rooms" && tr && Array.isArray(tr.available_rooms) && tr.available_rooms.length > 0) {
          let html = renderSafeMarkdown(msg.answer || "");
          html += '<div class="table-wrap"><table class="data-tbl"><thead><tr><th>Room</th><th>Type</th><th>Capacity</th><th>Floor</th></tr></thead><tbody>';
          tr.available_rooms.forEach(function (rm) {
            html += '<tr>' +
              '<td><code>' + escapeHtml(rm.room_id || rm.id || "") + '</code></td>' +
              '<td>' + escapeHtml(rm.room_type || rm.type || "Classroom") + '</td>' +
              '<td>' + escapeHtml(rm.capacity !== undefined ? rm.capacity : "—") + '</td>' +
              '<td>' + escapeHtml(rm.floor !== undefined ? rm.floor : "—") + '</td>' +
            '</tr>';
          });
          html += '</tbody></table></div>';
          return html;
        }

        // Default safe escaped markdown
        return renderSafeMarkdown(msg.answer || "");
      }

      // Render choice chips for duplicate names / shared titles
      function renderChoiceChipsEl(options) {
        if (!Array.isArray(options) || options.length === 0) return null;
        const wrap = document.createElement("div");
        wrap.className = "choice-wrap";

        const lbl = document.createElement("div");
        lbl.className = "choice-label";
        lbl.textContent = "Multiple matches found — select one:";
        wrap.appendChild(lbl);

        const list = document.createElement("div");
        list.className = "choice-chips";
        options.forEach(function (opt) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice-chip";
          const nameSpan = document.createElement("span");
          nameSpan.className = "choice-chip-name";
          nameSpan.textContent = opt.name || opt.label || "";
          const metaSpan = document.createElement("span");
          metaSpan.className = "choice-chip-meta";
          const parts = [];
          if (opt.department) parts.push(opt.department);
          if (opt.cabin) parts.push("Cabin: " + opt.cabin);
          metaSpan.textContent = parts.join(" \u2022 ");
          btn.appendChild(nameSpan);
          btn.appendChild(metaSpan);
          btn.addEventListener("click", function () {
            if (!isSending) {
              sendMessage(opt.query || opt.name || "");
            }
          });
          list.appendChild(btn);
        });
        wrap.appendChild(list);
        return wrap;
      }

      // Render collapsed-by-default Evidence Drawer
      function renderEvidenceDrawerHtml(msg) {
        if (!msg.evidence) return "";
        const ev = msg.evidence;
        const g = ev.grounding || { passed: true, substituted: false, reason: null };
        let gHtml = '<span class="ev-pass">Passed</span>';
        if (g.substituted) {
          gHtml = '<span class="ev-sub">Substituted</span> — ' + escapeHtml(g.reason || "Grounded fallback used");
        } else if (g.passed === false) {
          gHtml = '<span class="ev-sub">Not passed</span>' + (g.reason ? (" — " + escapeHtml(g.reason)) : "");
        }

        const argsStr = ev.args && Object.keys(ev.args).length > 0
          ? JSON.stringify(ev.args)
          : "{}";

        const summaryLeft =
          "Evidence \u00b7 " +
          escapeHtml(ev.tool || "n/a") +
          " \u00b7 " +
          escapeHtml(ev.result_count !== undefined ? ev.result_count : 0) + " rows" +
          " \u00b7 " +
          escapeHtml(ev.latency_ms !== undefined ? ev.latency_ms : 0) + " ms";

        const st = ev.stage_timings_ms || {};
        const stageStr =
          "Routing: " + escapeHtml(st.routing_ms !== undefined ? st.routing_ms : 0) + " ms · " +
          "Tool: " + escapeHtml(st.tool_ms !== undefined ? st.tool_ms : 0) + " ms · " +
          "Generation: " + escapeHtml(st.generation_ms !== undefined ? st.generation_ms : 0) + " ms";

        let relHtml = "";
        if (ev.relevance_score && ev.relevance_score.top_score !== undefined) {
          const rs = ev.relevance_score;
          const relCls = rs.below_threshold ? "ev-sub" : "ev-pass";
          relHtml =
            '<div class="ev-span-2"><div class="ev-cell-label">Relevance Score</div><div class="ev-cell-val">' +
              '<span class="' + relCls + '">' + escapeHtml(rs.top_score) + '</span>' +
              ' (min threshold: ' + escapeHtml(rs.min_similarity_score) +
              (rs.below_threshold ? ' — below threshold' : ' — passed') + ')' +
            '</div></div>';
        }

        return (
          '<details class="evidence-drawer">' +
            '<summary><span>' + summaryLeft + '</span></summary>' +
            '<div class="evidence-grid">' +
              '<div><div class="ev-cell-label">Tool</div><div class="ev-cell-val">' + escapeHtml(ev.tool || "—") + '</div></div>' +
              '<div><div class="ev-cell-label">Intent</div><div class="ev-cell-val">' + escapeHtml(ev.intent || "campus_tool") + '</div></div>' +
              '<div><div class="ev-cell-label">Role</div><div class="ev-cell-val">' + escapeHtml(ev.role || "student") + '</div></div>' +
              '<div><div class="ev-cell-label">Row Count</div><div class="ev-cell-val">' + escapeHtml(ev.result_count !== undefined ? ev.result_count : 0) + '</div></div>' +
              '<div><div class="ev-cell-label">Latency</div><div class="ev-cell-val">' + escapeHtml(ev.latency_ms !== undefined ? ev.latency_ms : 0) + ' ms</div></div>' +
              '<div><div class="ev-cell-label">Status</div><div class="ev-cell-val">' + escapeHtml(ev.status || "—") + '</div></div>' +
              '<div><div class="ev-cell-label">Engine</div><div class="ev-cell-val">' + escapeHtml(ev.engine || currentEngineLabel) + '</div></div>' +
              '<div class="ev-span-2"><div class="ev-cell-label">Stage Timings</div><div class="ev-cell-val">' + stageStr + '</div></div>' +
              relHtml +
              '<div class="ev-span-2"><div class="ev-cell-label">Grounding</div><div class="ev-cell-val">' + gHtml + '</div></div>' +
              '<div class="ev-span-2"><div class="ev-cell-label">Arguments</div><div class="ev-cell-val">' + escapeHtml(argsStr) + '</div></div>' +
            '</div>' +
          '</details>'
        );
      }

      // Render progress indicator driven strictly by SSE stage events
      function renderStepsHtml(activeStage, completedStages, stageLabels) {
        const labels = stageLabels || {};
        const defs = [
          { key: "choosing_tool", label: labels["choosing_tool"] || (routingMode === "llm_intent" ? "Understanding intent (Qwen)" : "Choosing tool") },
          { key: "retrieving_data", label: labels["retrieving_data"] || "Retrieving data" },
          { key: "writing_answer", label: labels["writing_answer"] || "Writing answer" }
        ];
        return '<div class="progress-steps">' + defs.map(function (d) {
          let cls = "step-pill";
          let icon = "\u25cb";
          if (completedStages[d.key]) {
            cls += " done";
            icon = "\u2713";
          } else if (activeStage === d.key) {
            cls += " active";
            icon = "\u25cf";
          }
          return '<span class="' + cls + '">' + icon + ' ' + escapeHtml(d.label) + '</span>';
        }).join("") + '</div>';
      }

      function renderWelcome() {
        const box = document.createElement("div");
        box.className = "welcome";

        const h1 = document.createElement("h1");
        h1.textContent = "SRMIST Campus Knowledge Assistant";
        const p = document.createElement("p");
        p.textContent = "Ask grounded questions across courses, Regulations-2021 syllabi, prerequisites, faculty profiles, classroom availability, and admissions. Every answer includes an expandable evidence drawer.";
        box.appendChild(h1);
        box.appendChild(p);

        const lbl = document.createElement("div");
        lbl.className = "starter-label";
        lbl.textContent = "Starter Prompts (built live from tool registry)";
        box.appendChild(lbl);

        const grid = document.createElement("div");
        grid.className = "starter-grid";
        if (dynamicStarters.length === 0) {
          const loading = document.createElement("div");
          loading.style.fontSize = "13px";
          loading.style.color = "var(--text-muted)";
          loading.textContent = "Loading tools from registry...";
          grid.appendChild(loading);
        } else {
          dynamicStarters.forEach(function (st) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "starter-chip";
            const tSpan = document.createElement("span");
            tSpan.className = "starter-chip-tool";
            tSpan.textContent = st.tool;
            const qSpan = document.createElement("span");
            qSpan.className = "starter-chip-q";
            qSpan.textContent = st.query;
            btn.appendChild(tSpan);
            btn.appendChild(qSpan);
            btn.addEventListener("click", function () {
              if (!isSending) sendMessage(st.query);
            });
            grid.appendChild(btn);
          });
        }
        box.appendChild(grid);
        return box;
      }

      function renderMessageElement(msg) {
        const row = document.createElement("div");
        row.className = "msg-row " + (msg.role === "user" ? "user" : "assistant");

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";

        if (msg.role === "user") {
          bubble.textContent = msg.text || "";
        } else {
          bubble.innerHTML = renderStructuredBody(msg) + renderEvidenceDrawerHtml(msg);
          const chipsEl = renderChoiceChipsEl(msg.options);
          if (chipsEl) {
            const drawer = bubble.querySelector("details.evidence-drawer");
            if (drawer) bubble.insertBefore(chipsEl, drawer);
            else bubble.appendChild(chipsEl);
          }
        }
        row.appendChild(bubble);
        return row;
      }

      function renderChat() {
        const s = getActiveSession();
        chatInnerEl.innerHTML = "";
        if (!s.messages || s.messages.length === 0) {
          chatInnerEl.appendChild(renderWelcome());
        } else {
          s.messages.forEach(function (m) {
            chatInnerEl.appendChild(renderMessageElement(m));
          });
        }
        chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
      }

      // Send query over SSE stream
      async function sendMessage(rawText) {
        const text = (rawText || "").trim();
        if (!text || isSending) return;

        isSending = true;
        sendBtn.disabled = true;
        queryInput.value = "";
        autoResizeInput();

        const session = getActiveSession();
        if (session.messages.length === 0) {
          session.title = text.length > 36 ? text.slice(0, 36) + "..." : text;
          renderSessions();
        }
        session.messages.push({ role: "user", text: text });
        saveSessions();
        renderChat();

        // Create live assistant placeholder with stream-driven progress steps
        const liveRow = document.createElement("div");
        liveRow.className = "msg-row assistant";
        const liveBubble = document.createElement("div");
        liveBubble.className = "msg-bubble";
        const stepsContainer = document.createElement("div");
        const streamBody = document.createElement("div");
        liveBubble.appendChild(stepsContainer);
        liveBubble.appendChild(streamBody);
        liveRow.appendChild(liveBubble);
        chatInnerEl.appendChild(liveRow);
        chatScrollEl.scrollTop = chatScrollEl.scrollHeight;

        let activeStage = null;
        const completedStages = {};
        const stageLabels = {};
        function updateStage(stageName, stageLabel) {
          if (stageLabel) stageLabels[stageName] = stageLabel;
          if (activeStage && activeStage !== stageName) {
            completedStages[activeStage] = true;
          }
          if (stageName === "retrieving_data") completedStages["choosing_tool"] = true;
          if (stageName === "writing_answer") {
            completedStages["choosing_tool"] = true;
            completedStages["retrieving_data"] = true;
          }
          activeStage = stageName;
          stepsContainer.innerHTML = renderStepsHtml(activeStage, completedStages, stageLabels);
        }

        const ctrl = new AbortController();
        const timeoutHandle = setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS);

        const assistantMsg = {
          role: "assistant",
          answer: "",
          detail: "",
          status: "SUCCESS",
          tool: "",
          toolResult: null,
          options: [],
          useQwen: useQwenProse,
          evidence: null,
          errorType: null,
          errorTitle: null
        };

        try {
          const resp = await fetch(API_BASE + "/agent/ask/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              query: text,
              use_qwen: useQwenProse,
              routing_mode: routingMode,
              session_id: session.id
            }),
            signal: ctrl.signal
          });

          if (!resp.ok) {
            let errJson = {};
            try { errJson = await resp.json(); } catch (_) {}

            if (resp.status === 429) {
              const retrySec = errJson.retry_after_seconds || resp.headers.get("Retry-After") || 60;
              assistantMsg.status = "RATE_LIMITED";
              assistantMsg.errorType = "HTTP_WARNING";
              assistantMsg.errorTitle = "Rate limit reached (HTTP 429)";
              assistantMsg.answer = "Too many requests — please try again in " + retrySec + " seconds.";
            } else if (resp.status === 401) {
              assistantMsg.status = errJson.status || "AUTHENTICATION_FAILED";
              assistantMsg.errorType = "HTTP_WARNING";
              assistantMsg.errorTitle = "Authentication required (HTTP 401)";
              assistantMsg.answer = errJson.detail || "Your credentials could not be verified. Anonymous requests run as a Student without a token.";
            } else if (resp.status === 403) {
              const st = errJson.status || "POLICY_VIOLATION";
              if (st === "POLICY_VIOLATION" || st === "ROLE_SPOOFING_BLOCKED" || st === "VALIDATION_ERROR" || st === "FORBIDDEN_TOOL_FOR_ROLE") {
                assistantMsg.status = st;
                assistantMsg.detail = errJson.detail || "This request is not permitted under the active security policy.";
              } else {
                assistantMsg.status = "FORBIDDEN";
                assistantMsg.errorType = "HTTP_WARNING";
                assistantMsg.errorTitle = "Access denied (HTTP 403)";
                assistantMsg.answer = errJson.detail || "Your current role is not permitted to perform this action.";
              }
            } else {
              assistantMsg.status = errJson.status || ("HTTP_" + resp.status);
              assistantMsg.errorType = "HTTP_WARNING";
              assistantMsg.errorTitle = "Request failed (HTTP " + resp.status + ")";
              assistantMsg.answer = errJson.detail || "The server could not complete this request. Please try again.";
            }

            if (errJson.tool || errJson.status) {
              assistantMsg.evidence = {
                tool: errJson.tool || errJson.tool_selected || "security_guard",
                args: errJson.args || {},
                role: errJson.role || "student",
                result_count: errJson.result_count || 0,
                latency_ms: errJson.latency_ms || 0,
                status: assistantMsg.status,
                grounding: errJson.grounding || { passed: false, substituted: false, reason: "Blocked before execution" },
                engine: errJson.engine || currentEngineLabel
              };
            }
          } else {
            const reader = resp.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";
            let streamedText = "";

            while (true) {
              const chunk = await reader.read();
              if (chunk.done) break;
              buffer += decoder.decode(chunk.value, { stream: true });

              const events = buffer.split("\n\n");
              buffer = events.pop() || "";

              for (let i = 0; i < events.length; i++) {
                const rawEv = events[i];
                const dataLines = rawEv.split("\n").filter(function (l) { return l.startsWith("data:"); });
                if (!dataLines.length) continue;
                const jsonStr = dataLines.map(function (l) { return l.slice(5).trim(); }).join("\n");
                let payload;
                try { payload = JSON.parse(jsonStr); } catch (_) { continue; }

                const evType = payload.event;
                if (evType === "stage") {
                  updateStage(payload.stage, payload.label);
                } else if (evType === "meta") {
                  assistantMsg.tool = payload.tool_selected || assistantMsg.tool;
                  assistantMsg.toolResult = payload.tool_result || null;
                } else if (evType === "delta") {
                  streamedText += (payload.token || "");
                  streamBody.innerHTML = renderSafeMarkdown(streamedText);
                  chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
                } else if (evType === "done") {
                  completedStages["choosing_tool"] = true;
                  completedStages["retrieving_data"] = true;
                  completedStages["writing_answer"] = true;
                  assistantMsg.answer = payload.answer !== undefined ? payload.answer : streamedText;
                  assistantMsg.status = payload.status || "SUCCESS";
                  assistantMsg.tool = payload.tool || assistantMsg.tool;
                  assistantMsg.options = Array.isArray(payload.options) ? payload.options : [];
                  assistantMsg.evidence = {
                    tool: payload.tool || assistantMsg.tool,
                    intent: payload.intent || "campus_tool",
                    args: payload.args || {},
                    role: payload.role || "student",
                    result_count: payload.result_count !== undefined ? payload.result_count : 0,
                    latency_ms: payload.latency_ms !== undefined ? payload.latency_ms : 0,
                    stage_timings_ms: payload.stage_timings_ms || null,
                    relevance_score: payload.relevance_score || null,
                    status: payload.status || "SUCCESS",
                    grounding: payload.grounding || { passed: true, substituted: false, reason: null },
                    engine: payload.engine || currentEngineLabel
                  };
                } else if (evType === "error") {
                  assistantMsg.status = payload.status || "POLICY_VIOLATION";
                  assistantMsg.detail = payload.detail || "Request blocked by security policy.";
                  assistantMsg.tool = payload.tool || payload.tool_selected || "";
                  assistantMsg.options = Array.isArray(payload.options) ? payload.options : [];
                  assistantMsg.evidence = {
                    tool: payload.tool || payload.tool_selected || "ast_security_interception",
                    intent: payload.intent || "security_block",
                    args: payload.args || {},
                    role: payload.role || "student",
                    result_count: payload.result_count !== undefined ? payload.result_count : 0,
                    latency_ms: payload.latency_ms !== undefined ? payload.latency_ms : 0,
                    status: assistantMsg.status,
                    grounding: payload.grounding || { passed: false, substituted: false, reason: "Blocked by policy" },
                    engine: payload.engine || currentEngineLabel
                  };
                }
              }
            }
          }
        } catch (err) {
          if (err && err.name === "AbortError") {
            assistantMsg.status = "TIMEOUT";
            assistantMsg.errorType = "HTTP_WARNING";
            assistantMsg.errorTitle = "Request timed out";
            assistantMsg.answer = "The server took too long to respond. Try again or switch to Instant mode for sub-second answers.";
          } else {
            assistantMsg.status = "NETWORK_ERROR";
            assistantMsg.errorType = "HTTP_WARNING";
            assistantMsg.errorTitle = "Connection error";
            assistantMsg.answer = "Could not reach the Campus Knowledge Server. Verify the server is running and try again.";
          }
        } finally {
          clearTimeout(timeoutHandle);
          session.messages.push(assistantMsg);
          saveSessions();
          renderChat();
          isSending = false;
          sendBtn.disabled = false;
          queryInput.focus();
        }
      }

      // Sidebar & input helpers
      function openSidebar() {
        sidebarEl.classList.add("open");
        backdropEl.classList.add("open");
      }

      function closeSidebar() {
        sidebarEl.classList.remove("open");
        backdropEl.classList.remove("open");
      }

      function autoResizeInput() {
        queryInput.style.height = "auto";
        queryInput.style.height = Math.min(queryInput.scrollHeight, 140) + "px";
      }

      // Event bindings
      openSidebarBtn.addEventListener("click", openSidebar);
      closeSidebarBtn.addEventListener("click", closeSidebar);
      backdropEl.addEventListener("click", closeSidebar);
      newChatBtn.addEventListener("click", createSession);

      themeBtn.addEventListener("click", function () {
        const cur = document.documentElement.getAttribute("data-theme");
        applyTheme(cur === "dark" ? "light" : "dark");
      });

      modeHybridBtn.addEventListener("click", function () {
        routingMode = "hybrid";
        applyModeUI();
      });
      modeIntentBtn.addEventListener("click", function () {
        routingMode = "llm_intent";
        applyModeUI();
      });
      proseToggleBtn.addEventListener("click", function () {
        useQwenProse = !useQwenProse;
        applyModeUI();
      });

      chatForm.addEventListener("submit", function (ev) {
        ev.preventDefault();
        sendMessage(queryInput.value);
      });

      queryInput.addEventListener("input", autoResizeInput);
      queryInput.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" && !ev.shiftKey) {
          ev.preventDefault();
          sendMessage(queryInput.value);
        }
      });

      // Init
      let savedTheme = "light";
      try {
        savedTheme = localStorage.getItem(STORAGE_THEME_KEY) || "light";
        const sr = localStorage.getItem(STORAGE_ROUTING_KEY);
        if (sr === "hybrid" || sr === "llm_intent") routingMode = sr;
        useQwenProse = localStorage.getItem(STORAGE_PROSE_KEY) === "1";
      } catch (_) {}

      applyTheme(savedTheme);
      applyModeUI();
      loadSessions();
      renderSessions();
      renderChat();
      refreshHealth();
      setInterval(refreshHealth, HEALTH_POLL_MS);
      loadStarterChipsFromRegistry();
    })();
  </script>
</body>
</html>
